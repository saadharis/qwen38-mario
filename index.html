<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QWEN 3.8 MARIO — A Super Platformer Simulation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 28%, #14203a, #070b16);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color:#8fa3c8; overflow:hidden;
  }
  #wrap { position:relative; }
  #game {
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius:10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(120,160,255,.16);
    background:#5c94fc;
  }
  #cap { margin-top:10px; font-size:12px; letter-spacing:.10em; text-transform:uppercase; opacity:.55; text-align:center; }
  /* ---- touch controls ---- */
  #touch { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between;
           padding:14px 20px; pointer-events:none; z-index:5; }
  @media (pointer:coarse) { #touch { display:flex; } }
  .tgroup { display:flex; gap:14px; }
  .tbtn {
    pointer-events:auto; width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.30);
    color:#dfe8ff; font-size:22px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .tbtn:active { background:rgba(255,255,255,.25); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="cap">QWEN 3.8 MARIO &nbsp;·&nbsp; Arrows / WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; R restart</div>
<div id="touch">
  <div class="tgroup"><div class="tbtn" id="tL">◀</div><div class="tbtn" id="tR">▶</div></div>
  <div class="tgroup"><div class="tbtn" id="tJ">⬆</div></div>
</div>

<script>
'use strict';
/* =====================================================================
   QWEN 3.8 MARIO — a Mario-style side-scrolling platformer
   Pure HTML/CSS/JS, canvas 2D, procedural art + WebAudio chiptune.
   ===================================================================== */

const T = 40;                       // tile size (px)
const VPW = 960, VPH = 540;         // virtual resolution
const LH = 15;                      // level rows
const GRAV = 0.5, MAXFALL = 13, JUMPV = 14.2, MAXRUN = 3.7;
              /* full jump: ~202px rise, ~210px air distance at full speed */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

function fit(){
  const s = Math.min(innerWidth / VPW, (innerHeight - 40) / VPH);
  cvs.style.width  = Math.floor(VPW * s) + 'px';
  cvs.style.height = Math.floor(VPH * s) + 'px';
}
addEventListener('resize', fit); fit();

window.__errs = [];
window.addEventListener('error', e => { window.__errs.push(e.message); });

/* ============================ AUDIO ============================ */
const m2h = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = {
  /* Super Mario BROS. — WORLD 1-1 OVERWORLD, the ICONIC loop.
     20 bars x 8 eighths = 160 steps, C major: A A B B C.
     groove = the step where kick/snare/hat join (bar 9, like the original). */
  stage: { tempo:176, groove:72,
    mel:[
           72, 0, 76, 0, 79, 0, 84, 0, 77, 84, 81, 79, 0, 0, 0, 0,   72, 0, 76, 0, 79, 0, 84, 0, 79, 74, 77, 76, 0, 0, 0, 0,
           72, 0, 76, 0, 79, 0, 84, 0, 77, 84, 81, 79, 0, 0, 0, 0,   72, 0, 76, 0, 79, 0, 84, 0, 79, 74, 77, 76, 0, 0, 0, 0,
           76, 0, 74, 0, 72, 0, 71, 0, 69, 67, 65, 67, 0, 0, 0, 0,   77, 0, 76, 0, 74, 0, 72, 0, 71, 69, 67, 65, 0, 0, 0, 0,
           76, 0, 74, 0, 72, 0, 71, 0, 69, 67, 65, 67, 0, 0, 0, 0,   77, 0, 76, 0, 74, 0, 72, 0, 71, 69, 67, 65, 0, 0, 0, 0,
           76, 0, 74, 0, 72, 0, 74, 0, 71, 69, 67, 67, 0, 0, 0, 0,   64, 0, 0, 0, 0, 0, 64, 0, 0, 0, 67, 0, 65, 0, 64, 0 ],
    bas:[
           36, 36, 36, 36, 36, 36, 36, 36, 43, 50, 41, 49, 43, 50, 41, 49,   36, 36, 36, 36, 36, 36, 36, 36, 43, 50, 41, 49, 43, 50, 41, 49,
           36, 36, 36, 36, 36, 36, 36, 36, 43, 50, 41, 49, 43, 50, 41, 49,   36, 36, 36, 36, 36, 36, 36, 36, 43, 50, 41, 49, 43, 50, 41, 49,
           43, 43, 43, 43, 40, 47, 40, 47, 43, 50, 43, 50, 43, 50, 43, 50,   36, 43, 41, 47, 36, 43, 41, 47, 36, 36, 36, 36, 36, 36, 36, 36,
           43, 43, 43, 43, 40, 47, 40, 47, 43, 50, 43, 50, 43, 50, 43, 50,   43, 43, 43, 43, 40, 47, 40, 47, 43, 50, 43, 50, 43, 50, 43, 50,
           36, 0, 43, 0, 36, 0, 43, 0, 36, 0, 43, 0, 36, 0, 43, 0,   36, 36, 36, 36, 43, 43, 43, 43, 43, 50, 46, 46, 0, 0, 0, 0 ] },
  /* The classic game-over song: E5, C5, G4 (held), dropping to an E4. One-shot. */
  gameover: { tempo:132, once:true, total:7,
    mel:[64,0, 60,0, 55,0, 52], len:[1,1,1,1,1.5,0.5,2.5],
    bas:[0,0, 40,0, 0,0, 40] }
};
SONGS.menu = SONGS.stage;   /* title screen rides the same famous loop */
SONGS.clear = null;         /* victory speaks via the clear SFX fanfare, not a song */

const A = {
  ctx:null, muted:false, music:null, step:0, nextT:0,
  init(){
    if (this.ctx) { this.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
    this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = 0.5; this.sfxG.connect(this.master);
    this.musG = this.ctx.createGain(); this.musG.gain.value = 0.75; this.musG.connect(this.master);
    setInterval(() => this.schedule(), 60);
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  _osc(f, dur, type, vol, when, dest, f2){
    if (!this.ctx || this.muted) return;
    when = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, when);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2), when + dur);
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g); g.connect(dest || this.sfxG);
    o.start(when); o.stop(when + dur + 0.03);
  },
  noise(dur, vol, hp, dest){
    if (!this.ctx || this.muted) return;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    s.connect(f); f.connect(g); g.connect(dest || this.sfxG); s.start();
  },
  _note(f, dur, type, vol, when){
    if (!this.ctx || this.muted) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g); g.connect(this.musG);
    o.start(when); o.stop(when + dur + 0.03);
  },
  setMusic(name){
    if (this.music === name) return;
    this.music = name; this.step = 0;
    if (this.ctx) this.nextT = this.ctx.currentTime + 0.08;
  },
  /* movement-reactive: sprinting speeds the tempo up and chirps the lead higher
     (à la 2-1); being airborne ducks the lead so SFX speak. Smoothed. */
  setSpeed(v, airborne){
    const r = Math.min(1, Math.abs(v) / MAXRUN);
    this.mt = { p: 1 + 0.22 * r, l: 1 + 0.035 * r };   // tempo +30% max, pitch ~+2 st max
    const tgt = airborne ? 0.55 : 1;
    this.ldrive = this.ldrive == null ? 1 : this.ldrive + (tgt - this.ldrive) * 0.06;
  },
  schedule(){
    if (!this.ctx) return;
    const S = this.music ? SONGS[this.music] : null;
    if (!S) return;
    const MT = this.mt || {p:1,l:1};            // tempo + pitch meters from run speed
    const N = S.mel.length;
    const d = 60 / S.tempo / 2 / MT.p;          // base eighth length, sprint-scaled
    const ld = this.ldrive == null ? 1 : this.ldrive;
    while (this.nextT < this.ctx.currentTime + 0.25){
      if (S.once){
        if (this.step >= S.total){               // one-shot finished
          this.music = null; this.step = 0;
          if (this.ctx) this.nextT = this.ctx.currentTime + 0.08;
          return;
        }
        const mel = S.mel[this.step], bas = S.bas[this.step];
        const dur8 = S.len[this.step] || 1;
        if (mel) this._note(m2h(mel), d * dur8 * 0.97, 'square', 0.17, this.nextT);
        if (bas) this._note(m2h(bas), d * dur8 * 0.95, 'triangle', 0.26, this.nextT);
        this.nextT += d * dur8; this.step++;
        continue;
      }
      const idx = this.step % N;                 // looping song
      const mel = S.mel[idx], bas = S.bas[idx];
      if (mel) this._note(m2h(mel) * MT.l, d * 0.90, 'square', 0.15 * ld, this.nextT);
      if (bas) this._note(m2h(bas) * MT.l, d * 0.95, 'triangle', 0.26, this.nextT);
      if (S.groove && typeof S.groove === 'number' && idx >= S.groove){
        const off8 = idx % 8;
        if (off8 === 0 || off8 === 4) this._note(m2h(33), d * 0.85, 'triangle', 0.26, this.nextT);  // kick
        if (off8 === 2 || off8 === 6) this.noise(0.05, 0.085, 1700, this.musG);                     // snare 2&4
        if (idx % 2 === 1) this.noise(0.02, 0.028, 7500, this.musG);                               // hats
      }
      this.nextT += d; this.step++;
    }
  },
  /* --- sfx presets --- */
  jump(){ this._osc(300, 0.16, 'square', 0.30, 0, this.sfxG, 760); },
  coin(){ const t = this.ctx && this.ctx.currentTime;
          if (t){ this._osc(988, 0.07, 'sine', 0.30, t); this._osc(1319, 0.30, 'sine', 0.30, t + 0.07); } },
  stomp(){ this._osc(250, 0.09, 'square', 0.32, 0, this.sfxG, 60); this.noise(0.08, 0.12, 900); },
  bump(){ this._osc(95, 0.08, 'square', 0.34, 0, this.sfxG, 70); },
  brk(){ this.noise(0.16, 0.22, 300); this._osc(190, 0.1, 'triangle', 0.25, 0, this.sfxG, 60); },
  oneup(){ const t = this.ctx && this.ctx.currentTime;
           if (t) [660,784,1320].forEach((f,i)=>this._osc(f, 0.14, 'square', 0.24, t + i*0.12)); },
  die(){ const t = this.ctx && this.ctx.currentTime;
         if (t) [392,330,262,196,131].forEach((f,i)=>this._osc(f, 0.20, 'square', 0.26, t + i*0.14)); },
  flag(){ this._osc(1400, 0.5, 'square', 0.18, 0, this.sfxG, 300); },
  clear(){ const t = this.ctx && this.ctx.currentTime;
           if (t) [523,659,784,1047,1319,1568,1976].forEach((f,i)=>this._osc(f, 0.15, 'square', 0.24, t + i*0.105)); },
  toggleMute(){
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.6;
    return this.muted;
  }
};

/* ============================ LEVEL ============================ */
const LV = {
  W: 224, H: LH,
  ground: [[16,'#'],[20,'B'],[21,'?'],[22,'B'],[27,'B'],[28,'B'],[29,'B'],[30,'B'],[31,'B'],
           [54,'B'],[55,'?'],[56,'B'],[57,'?'],[58,'B'],[75,'B'],[76,'B'],[77,'B'],
           [90,'?'],[91,'B'],[92,'B'],[93,'B'],[94,'?'],
           [142,'B'],[143,'B'],[144,'?'],[145,'B'],[146,'B'],
           [168,'B'],[169,'B'],[170,'?'],[171,'B'],[172,'B'],
           [182,'?'],[183,'B'],[184,'B'],[185,'B']],
  r8:  [[111,'C'],[112,'C'],[113,'C'],[114,'C'],[115,'C']],
  lowCoins: [[95,'C'],[96,'C'],[97,'C'],[98,'C']],
  pitCoins: [[154,11],[155,11],[156,11]],
  plateau: [[110,'E'],[111,'E'],[112,'E'],[113,'E'],[114,'E'],[115,'E'],[116,'E']],
  goalow: { bricks:[[82,'B'],[83,'?'],[84,'B'],[85,'?']] },
  stairs: [
    {x:106,h:1},{x:107,h:2},{x:108,h:3},{x:109,h:4},{x:110,h:4},{x:111,h:4},{x:112,h:4},
    {x:113,h:4},{x:114,h:4},{x:115,h:4},{x:116,h:4},{x:117,h:4},{x:118,h:3},
    {x:119,h:2},{x:120,h:1},
    {x:200,h:1},{x:201,h:2},{x:202,h:3},{x:203,h:4},{x:204,h:4}
  ],
  pipes: [ {x:41,h:2},{x:49,h:3},{x:65,h:4},{x:129,h:2},{x:137,h:3},
           {x:157,h:4},{x:163,h:3},{x:189,h:2} ],
  holes: [[33,35],[68,70],[100,102],[150,152]],
  spikes: [[124,12],[125,12],[176,12],[177,12],[178,12]],
  goombas: [[25],[31],[44],[52],[59],[63],[76,360],[95],[97],[112,360],[127],[131],[133],[140],[149],[158],[165],[173],[174],[180],[186],[194]],
  zzts:  [[51],[148],[191]],
  FLAG_X: 207,
  CASTLE_X: 212 * T
};

let tiles;               // mutable grid
const BUMPVS = {};       // "x,y" -> remaining frames (visual bounce)
let enemies = [];
let flagDrop = 0;        // 0..1 flag cloth slide
let parts = [];          // particles
let bannerTxt = '', bannerT = 0;

function buildTiles(){
  const g = [];
  for (let y = 0; y < LH; y++) g.push(new Array(LV.W).fill('.'));
  const set = (x, y, c) => { if (x>=0 && x<LV.W && y>=0 && y<LH) g[y][x] = c; };
  const hole = (x0, x1) => { for (let x=x0; x<=x1; x++){ set(x,13,'.'); set(x,14,'.'); } };
  for (let x = 0; x < LV.W; x++){ set(x,13,'#'); set(x,14,'#'); }
  for (const [a,b] of LV.holes) hole(a,b);
  for (const [x,c] of LV.ground) set(x, 9, c);
  for (const [x,c] of LV.r8)    set(x, 8, c);
  for (const [x,c] of LV.lowCoins) set(x, 12, c);
  for (const [x,c] of LV.plateau) set(x, 9, c);
  for (const [x,y] of LV.pitCoins) set(x, y, 'C');
  for (const [x,c] of LV.goalow.bricks) set(x, 9, c);
  for (const s of LV.stairs)
    for (let j = 0; j < s.h; j++) set(s.x, 12 - j, 'E');
  for (const p of LV.pipes){
    for (let i = 0; i < p.h; i++){
      const y = 12 - i;
      set(p.x,   y, i === 0 ? 't' : 'q');
      set(p.x+1, y, i === 0 ? 'T' : 'Q');
    }
  }
  for (const [x,y] of LV.spikes) set(x, y, '!');
  for (let r = 3; r <= 12; r++) set(LV.FLAG_X, r, 'F');
  return g;
}

function resetLevel(){
  tiles = buildTiles();
  for (const k in BUMPVS) delete BUMPVS[k];
  enemies = [];
  const mk = (x, type, footY) => {
    const w = 30, h = 28;
    const f = (footY !== undefined) ? footY : 13 * T;
    enemies.push({ x: x*T + (T - w)/2, y: f - h, w, h, direction: -1,
                   vx: -1, vy: 0, type, onGround:false, state:'walk', t: Math.random()*6,
                   sq: 0, dead:false, active:false });
  };
  for (const g of LV.goombas) mk(g[0], 'goomba', g[1]);
  for (const z of LV.zzts) mk(z[0], 'zzt');
  flagDrop = 0;
}

/* ============================ PHYSICS ============================ */
const SOLID = new Set(['#','B','?','U','E','q','Q','t','T']);
function tileAt(px, py){
  const cx = (px / T) | 0, cy = (py / T) | 0;
  if (cx < 0 || cx >= LV.W) return 'W';
  if (cy < 0 || cy >= LH) return '.';
  return tiles[cy][cx];
}
const isSolid = c => SOLID.has(c);
const solidPx = (px, py) => isSolid(tileAt(px, py));

function moveX(e){
  e.hitWall = false;
  e.x += e.vx;
  if (e.vx > 0){
    if (solidPx(e.x + e.w, e.y + 3) || solidPx(e.x + e.w, e.y + e.h/2) || solidPx(e.x + e.w, e.y + e.h - 3)){
      e.x = ((e.x + e.w) / T | 0) * T - e.w - 0.01; e.hitWall = true; e.vx = 0;
    }
  } else if (e.vx < 0){
    if (solidPx(e.x, e.y + 3) || solidPx(e.x, e.y + e.h/2) || solidPx(e.x, e.y + e.h - 3)){
      e.x = ((e.x + T) / T | 0) * T + 0.01; e.hitWall = true; e.vx = 0;
    }
  }
}
function moveY(e){
  e.onGround = false; e.hitHead = null;
  e.y += e.vy;
  if (e.vy > 0){
    if (solidPx(e.x + 3, e.y + e.h) || solidPx(e.x + e.w - 3, e.y + e.h)){
      e.y = ((e.y + e.h) / T | 0) * T - e.h - 0.01; e.vy = 0; e.onGround = true;
    }
  } else if (e.vy < 0){
    if (solidPx(e.x + 3, e.y) || solidPx(e.x + e.w - 3, e.y)){
      e.y = (e.y / T | 0) * T + 0.01;
      const r = (e.y / T | 0);
      const c1 = (e.x + 3) / T | 0, c2 = (e.x + e.w - 3) / T | 0;
      if (r >= 0 && r < LH && isSolid(tiles[r][c1]))      e.hitHead = { x: c1, y: r };
      else if (r >= 0 && r < LH && isSolid(tiles[r][c2])) e.hitHead = { x: c2, y: r };
      e.vy = 0;
    }
  }
}

/* ============================ ENTITIES ============================ */
const p = { x: 120, y: 13*T - 44, w: 26, h: 44, vx: 0, vy: 0, facing: 1,
            onGround: false, coyote: 0, jbuf: 0, animT: 0, airStomps: 0 };

let camX = 0, shake = 0, stompChain = 0;
let state = 'menu', stateT = 0;
let score = 0, coins = 0, lives = 3, timeLeft = 300;
let flagPhase = 0;
let best = 0;
try { best = +localStorage.getItem('q38m_best') || 0; } catch(e){}

function part(o){ parts.push(Object.assign({ t: 0, life: 30, type:'dot', size: 4, color:'#fff',
  x:0, y:0, vx:0, vy:0, rot:0, vr:0 }, o)); }
function floatText(x, y, txt, color){
  part({ type:'text', x, y, vy: -1.4, life: 55, txt, color: color || '#fff' });
}
function dust(x, y, n){
  for (let i = 0; i < n; i++)
    part({ type:'dust', x: x + (Math.random()*10-5), y: y - 2,
           vx: (Math.random()-0.5)*1.6, vy: -Math.random()*1.5, life: 22 + Math.random()*10,
           size: 3 + Math.random()*3, color: 'rgba(255,255,255,0.8)' });
}
function brickBreak(x, y){
  for (let i = 0; i < 5; i++)
    part({ type:'shard', x: x*T + T/2, y: y*T + T/2, vx: (Math.random()-0.5)*5,
           vy: -4 - Math.random()*4, life: 70, size: 8 + Math.random()*6,
           color: i%2 ? '#b5492a' : '#8c3218', rot: Math.random()*6, vr: (Math.random()-0.5)*0.4 });
}
function coinPop(x, y){
  part({ type:'coinh', x: x*T + T/2, y: y*T, vy: -8.4, life: 42, size: 14 });
}
function sparkle(x, y, n, col){
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.28, s = 1 + Math.random()*2.5;
    part({ type:'spark', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
           life: 24 + Math.random()*14, size: 3 + Math.random()*4, color: col || '#ffe066' });
  }
}
function fireworks(x, y){
  const cols = ['#ff5d5d','#ffd44d','#6ee7ff','#9dff6e','#ff9de2','#c39dff'];
  const c = cols[(Math.random()*cols.length)|0];
  for (let i = 0; i < 22; i++){
    const a = Math.random()*6.28, s = 1.5 + Math.random()*3.5;
    part({ type:'fw', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 45 + Math.random()*20,
           size: 3, color: c });
  }
}

function addScore(pts, x, y){
  const before = score;
  score += pts;
  if (y !== undefined) floatText(x, y, pts, '#ffffff');
  if (before < 10000 && score >= 10000){
    lives = Math.min(9, lives + 1);
    if (y !== undefined) floatText(x, y - 22, '1-UP!', '#7dff6e');
    A.oneup();
  }
}

function bumpBlock(tx, ty){
  if (ty < 0 || ty >= LH || tx < 0 || tx >= LV.W) return;
  const ch = tiles[ty][tx];
  const key = tx + ',' + ty;
  if (ch === '?'){
    tiles[ty][tx] = 'U';
    BUMPVS[key] = 12;
    coins++;
    if (coins % 100 === 0){ lives = Math.min(9, lives+1);
      floatText(tx*T+20, ty*T-20, '1-UP!', '#7dff6e'); A.oneup(); }
    addScore(200);
    coinPop(tx, ty); A.coin();
  } else if (ch === 'B'){
    tiles[ty][tx] = '.';
    brickBreak(tx, ty); shake = Math.max(shake, 4); A.brk();
  } else {
    BUMPVS[key] = 12; A.bump();
  }
}

function stompEnemy(e){
  e.state = 'squash'; e.sq = 0;
  stompChain = (p.airStomps > 0 ? stompChain + 1 : 0);
  stompChain = Math.min(stompChain, 4);
  const pts = [100,200,400,800,1600][stompChain];
  addScore(pts, e.x + e.w/2, e.y - 8);
  p.vy = (p.jbuf > 0) ? -12.5 : -8.8;
  p.airStomps = Math.min(p.airStomps + 1, 5);
  shake = Math.max(shake, 3);
  sparkle(e.x + e.w/2, e.y + e.h/2, 5, '#c9a06a');
  A.stomp();
}

/* ============================ GAME FLOW ============================ */
function saveBest(){ if (score > best){ best = score; try{ localStorage.setItem('q38m_best', best); }catch(e){} } }

function startGame(){ score = 0; coins = 0; lives = 3; intro(); }
function intro(){
  resetLevel();
  p.x = 120; p.y = 13*T - 44; p.vx = 0; p.vy = 0; p.facing = 1;
  p.airStomps = 0;
  camX = 0; timeLeft = 300; stompChain = 0;
  parts = [];
  state = 'intro'; stateT = 0;
}
function toMenu(){ state = 'menu'; stateT = 0; resetLevel(); camX = 0; A.setMusic('menu'); }

function hurt(fell){
  if (state !== 'play') return;
  state = 'dying'; stateT = 0;
  if (fell){ p.vx = 0; if (p.vy > 1) p.vy = 1; } else { p.vy = -11; p.vx = 0; }
  A.setMusic(null); A.die();
}

function startFlag(){
  state = 'flag'; stateT = 0; flagPhase = 1;
  A.setMusic(null); A.flag();
  p.vx = 0; p.vy = 0; p.facing = 1;
  p.x = LV.FLAG_X * T + 20 - p.w;
  p.y = Math.min(p.y, 13*T - p.h);                          // never below ground
  const foot = p.y + p.h;
  const climb = Math.max(0, Math.min(10, Math.round((13*T - foot) / T)));  // clamped 0-10
  const bonus = 500 + climb * 100;
  addScore(bonus, LV.FLAG_X * T + 30, p.y - 6);
}

/* ============================ INPUT ============================ */
const keys = { L:false, R:false, J:false };
const keymap = { ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R',
                 Space:'J', ArrowUp:'J', KeyW:'J', KeyZ:'J' };

addEventListener('keydown', e => {
  if (e.code in keymap){
    e.preventDefault();
    A.init(); A.resume();
    const k = keymap[e.code];
    if (k === 'J' && !keys.J && !e.repeat) p.jbuf = 7;
    keys[k] = true;
    return;
  }
  if (e.repeat) return;
  A.init(); A.resume();
  switch (e.code){
    case 'Enter':
      if (state === 'menu') startGame();
      else if (state === 'gameover') toMenu();
      else if (state === 'win') startGame();   // replay = fresh run (score/coins/lives reset)
      break;
    case 'KeyR':
      if (state === 'play' || state === 'pause' || state === 'flag') intro();
      break;
    case 'KeyP': case 'Escape':
      if (state === 'play') state = 'pause';
      else if (state === 'pause') state = 'play';
      break;
    case 'KeyM':
      A.toggleMute();
      bannerTxt = A.muted ? 'MUTED' : 'SOUND ON';
      bannerT = 90;
      break;
  }
});
addEventListener('keyup', e => {
  const k = keymap[e.code];
  if (!k) return;
  // variable jump height: release cuts the ascent to a floor speed (keeps tap-pops alive)
  if (k === 'J' && p.vy < -3.2) p.vy = -3.2;
  keys[k] = false;
});
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });

/* click / tap: start, resume, or jump */
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  A.init(); A.resume();
  if (state === 'menu') { startGame(); return; }
  if (state === 'gameover') { toMenu(); return; }
  if (state === 'win') { startGame(); return; }          // replay = fresh run
  if (state === 'pause') { state = 'play'; return; }
  if (state === 'play') p.jbuf = 7;            // tap = jump on mobile
});

/* touch controls */
function bindTouch(id, k){
  const el = document.getElementById(id);
  if (!el) return;
  const down = ev => { ev.preventDefault(); A.init(); A.resume();
                       if (k === 'J' && !keys.J) p.jbuf = 7; keys[k] = true; };
  const up   = ev => { ev.preventDefault();
                       if (k === 'J' && p.vy < -4) p.vy = -4; keys[k] = false; };
  el.addEventListener('touchstart', down, { passive:false });
  el.addEventListener('touchend', up, { passive:false });
  el.addEventListener('touchcancel', up, { passive:false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
}
bindTouch('tL','L'); bindTouch('tR','R'); bindTouch('tJ','J');

/* ============================ UPDATE ============================ */
function updatePlayer(){
  const dir = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
  if (dir !== 0){
    p.vx += dir * (p.onGround ? 0.16 : 0.10);
    if (Math.sign(p.vx) !== dir && Math.abs(p.vx) > 2.5) p.vx -= dir * 0.18; // skid
    p.vx = Math.max(-MAXRUN, Math.min(MAXRUN, p.vx));
    p.facing = dir;
    if (p.onGround && Math.abs(p.vx) > 2.6 && (p.animT | 0) % 6 === 0) dust(p.x + p.w/2, p.y + p.h, 1);
  } else {
    p.vx *= p.onGround ? 0.82 : 0.985;
    if (Math.abs(p.vx) < 0.06) p.vx = 0;
  }
  p.animT += Math.abs(p.vx) * 0.6;

  // coyote time + jump buffer
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && p.coyote > 0){
    p.vy = -JUMPV; p.coyote = 0; p.jbuf = 0; p.onGround = false;
    dust(p.x + p.w/2, p.y + p.h, 3);
    A.jump();
  }

  p.vy = Math.min(MAXFALL, p.vy + GRAV);
  moveX(p);
  const prevVy = p.vy;
  moveY(p);
  if (p.hitHead && prevVy < 0) bumpBlock(p.hitHead.x, p.hitHead.y);
  if (p.onGround){
    p.airStomps = 0;
    if (stompChain > 0) stompChain = 0;
  }

  p.x = Math.max(0, Math.min(LV.W*T - p.w, p.x));

  // collect coins
  for (let cy = (p.y / T | 0); cy <= ((p.y + p.h) / T | 0); cy++)
    for (let cx = (p.x / T | 0); cx <= ((p.x + p.w) / T | 0); cx++){
      if (cy >= 0 && cy < LH && cx >= 0 && cx < LV.W && tiles[cy][cx] === 'C'){
        tiles[cy][cx] = '.';
        coins++;
        if (coins % 100 === 0){ lives = Math.min(9, lives+1);
          floatText(p.x, p.y - 24, '1-UP!', '#7dff6e'); A.oneup(); }
        addScore(200, cx*T+20, cy*T);
        sparkle(cx*T+20, cy*T+20, 4);
        A.coin();
      }
    }

  // spikes
  for (let cy = (p.y / T | 0); cy <= ((p.y + p.h) / T | 0); cy++)
    for (let cx = (p.x / T | 0); cx <= ((p.x + p.w) / T | 0); cx++){
      if (cy >= 0 && cy < LH && cx >= 0 && cx < LV.W && tiles[cy][cx] === '!'){
        const sx = cx*T+7, sy = cy*T+14, sw = T-14, sh = T-14;
        if (p.x < sx+sw && p.x + p.w > sx && p.y < sy+sh && p.y + p.h > sy){ hurt(false); return; }
      }
    }

  // enemy collisions
  for (const e of enemies){
    if (e.dead || !e.active || e.state === 'squash') continue;
    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y){
      if (p.vy > 0 && (p.y + p.h - e.y) < 16 + p.vy){
        stompEnemy(e);
        p.y = e.y - p.h - 0.1;
      } else {
        hurt(false);
        return;
      }
    }
  }

  // flag
  if (p.x + p.w >= LV.FLAG_X*T + 14 && p.x < LV.FLAG_X*T + 42) { startFlag(); return; }

  // pit
  if (p.y > LH*T + 60) { hurt(true); return; }
}

function updateEnemies(){
  for (const e of enemies){
    if (e.dead) continue;
    if (!e.active){
      if (e.x < camX + VPW + 90 && e.x > camX - 40) e.active = true;
      else continue;
    }
    if (e.state === 'squash'){
      e.sq++;
      if (e.sq > 28) e.dead = true;
      continue;
    }
    e.t += 0.15;
    const spd = e.type === 'zzt' ? 1.75 : 1.0;
    e.vx = e.direction * spd;
    e.vy = Math.min(MAXFALL, e.vy + GRAV);
    moveX(e);
    if (e.hitWall) e.direction = -e.direction;
    moveY(e);
    if (e.y > LH*T + 120) e.dead = true;
  }
  // enemy-vs-enemy: separate and walk apart
  outer: for (let i = 0; i < enemies.length; i++)
    for (let j = i+1; j < enemies.length; j++){
      const a = enemies[i], b = enemies[j];
      if (a.state === 'squash' || b.state === 'squash') continue;
      if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y){
        const left = (a.x + a.w/2) < (b.x + b.w/2) ? a : b;
        const right = left === a ? b : a;
        const mid = (left.x + left.w + right.x) / 2;
        left.x = mid - left.w - 0.4;
        right.x = mid + 0.4;
        left.direction = -1;
        right.direction = 1;
      }
    }
}

function updateParticles(){
  for (const q of parts){
    q.t++;
    if (q.type === 'shard' || q.type === 'fw' || q.type === 'coinh') q.vy += 0.35;
    if (q.type === 'fw'){ q.vx *= 0.98; q.vy *= 0.97; }
    if (q.type === 'dust') q.vy -= 0.02;
    q.x += q.vx; q.y += q.vy; q.rot += q.vr || 0;
  }
  parts = parts.filter(q => q.t < q.life);
}

function updateCam(){
  const target = p.x + p.facing * 26 - VPW * 0.38;   // slight facing lookahead
  camX += (target - camX) * 0.14;
  camX = Math.max(0, Math.min(LV.W*T - VPW, camX));
  if (shake > 0) shake *= 0.86;
  for (const k in BUMPVS) if (--BUMPVS[k] <= 0) delete BUMPVS[k];
}

function update(){
  stateT++;
  if (bannerT > 0) bannerT--;
  switch (state){
    case 'menu':
      p.onGround = true;
      if (stateT % 240 === 120 && p.vy === 0) p.vy = -9;
      p.vy += GRAV;
      if (p.vy > 0){ p.y += p.vy; p.y = 13*T - 44; p.vy = 0; } else p.y += p.vy;
      camX = 0;
      A.setMusic('menu');
      break;
    case 'intro':
      if (stateT > 132){ state = 'play'; stateT = 0; A.setMusic('stage'); }
      break;
    case 'play':
      timeLeft -= 1/60;
      if (timeLeft <= 0){ timeLeft = 0; hurt(false); break; }
      updatePlayer();
      A.setSpeed(state === 'play' ? p.vx : 0, state === 'play' && !p.onGround);  // music follows the legs
      if (state === 'play'){ updateEnemies(); updateParticles(); updateCam(); }
      break;
    case 'flag':
      if (flagDrop < 1) flagDrop = Math.min(1, flagDrop + 0.045);
      if (flagPhase === 1){
        p.y += 3.6;
        if (p.y >= 13*T - p.h){ p.y = 13*T - p.h; flagPhase = 2; }
      } else if (flagPhase === 2){
        p.x += 2.3; p.animT += 1.4; p.facing = 1;
        if ((p.animT | 0) % 6 === 0) dust(p.x + p.w/2, p.y + p.h, 1);
        if (p.x >= 216 * T + 20) flagPhase = 3;
      } else {
        if (stateT % 14 === 0) fireworks(216*T + (Math.random()*200-100), 120 + Math.random()*120);
        if (stateT > 115){
          score += Math.ceil(timeLeft) * 5;
          floatText(p.x, p.y - 30, Math.ceil(timeLeft) * 5, '#9dff6e');
          state = 'clear'; stateT = 0; A.clear(); saveBest();
        }
      }
      updateParticles();
      break;
    case 'clear':
      if (stateT % 10 === 0) fireworks(216*T + (Math.random()*240-120), 100 + Math.random()*160);
      updateParticles();
      if (stateT > 135){ state = 'win'; stateT = 0; }
      break;
    case 'dying':
      p.vy = Math.min(MAXFALL, p.vy + GRAV * 0.8);
      p.y += p.vy;
      if (stateT > (p.y > LH*T + 300 && p.vy > 0 ? 210 : 125)){
        lives--;
        if (lives > 0) intro();
        else { state = 'gameover'; stateT = 0; saveBest(); A.setMusic('gameover'); }
      }
      break;
    case 'gameover':
    case 'win':
      break;   // gameover jingle fires once on entry; victory runs silent (clear SFX carries it)
  }
}

/* debug hooks (used by automated tests) */
window.__q = () => ({ state, stateT, px: Math.round(p.x), py: Math.round(p.y),
                      score, lives, coins, time: Math.ceil(timeLeft),
                      camX: Math.round(camX), errs: (window.__errs||[]).length,
                      muted: A.muted });
window.__tp = (xt) => { p.x = xt * T; p.y = 13*T - p.h; p.vy = 0; p.vx = 0;
                        camX = Math.max(0, Math.min(LV.W*T - VPW, p.x - 100)); };
window.__pe = () => enemies.filter(e => !e.dead).map(e => ({ x: Math.round(e.x), y: Math.round(e.y), t: e.type, a: e.active, s: e.state }));
window.__set = (px, py, vy) => { p.x = px; p.y = py; p.vy = vy || 0; p.vx = 0; p.onGround = false; p.airStomps = 0; };
window.__en = () => {                       // hover player above a safe live enemy, falling
  const cands = enemies.filter(e => !e.dead && e.active && e.state !== 'squash'
    && isSolid(tileAt(e.x + 4, e.y + e.h + 4)) && isSolid(tileAt(e.x + e.w - 4, e.y + e.h + 4)));
  if (!cands.length) return false;
  cands.sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x));
  const e = cands[0];
  p.x = e.x + (e.w - p.w) / 2; p.y = e.y - 52; p.vy = 3; p.vx = 0;
  camX = Math.max(0, Math.min(LV.W*T - VPW, p.x - 100));
  return true;
};
window.__groundAbove = (xt, yTop) => { p.x = xt*T; p.y = yTop - p.h; p.vy = 0; p.vx = 0; p.onGround = true;
  camX = Math.max(0, Math.min(LV.W*T - VPW, p.x - 100)); };
window.__me = (x, dir) => {                 // reposition nearest living enemy to tile x, walk dir (-1/1)
  const e = enemies.find(e => !e.dead && e.type === 'goomba' && Math.abs(e.x - x*T) < 60);
  if (!e) return false;
  e.x = x*T + 5; e.direction = dir; e.active = true; e.vy = 0;
  return true;
};
window.__lv = n => { lives = n; };
window.__mus = () => ({ m: A.music, tempo: A.mt && A.mt.p.toFixed(3), air: A.ldrive == null ? 1 : A.ldrive.toFixed(2) });
window.__tile = (x, y) => tiles[y] && tiles[y][x];          // probe one tile
window.__countCoins = () => { let n = 0; for (let y = 0; y < LH; y++) for (let x = 0; x < LV.W; x++) if (tiles[y][x] === 'C') n++; return n; };
window.__killAll = () => { enemies.forEach(e => { if (!e.dead) { e.state = 'squash'; e.sq = 29; } }); enemies = enemies.filter(e => !e.dead || e.state === 'squash'); };
window.__mkGoomba = (xt) => {               // spawn one fresh live goomba on the ground at tile xt
  const w = 30, h = 28;
  enemies.push({ x: xt*T + 5, y: 13*T - h, w, h, direction: -1, vx: -1, vy: 0,
                 type: 'goomba', onGround: true, state: 'walk', t: 0, sq: 0, dead: false, active: true });
};

/* ============================ RENDER ============================ */
const TEAL='#0fb9a8', TEALD='#0a8a7d', NAVY='#3457c9', NAVYD='#26398f',
      SKIN='#ffc79c', SKIND='#e0a06e', HAIR='#5a3a1e', SHOE='#6b4423',
      GREEN='#3aa655', GREENL='#5ecf7c', GREEND='#1f6b3a';

let tGlobal = 0;

function drawTiles(){
  const c0 = Math.max(0, (camX / T | 0) - 1), c1 = Math.min(LV.W - 1, ((camX + VPW) / T | 0) + 1);
  for (let x = c0; x <= c1; x++){
    for (let y = 0; y < LH; y++){
      const ch = tiles[y][x];
      if (ch === '.' || ch === 'F' || ch === 'q' || ch === 'Q' || ch === 't' || ch === 'T') continue;
      const key = x + ',' + y;
      const bumpOff = BUMPVS[key] ? -Math.sin((12 - BUMPVS[key]) / 12 * Math.PI) * 8 : 0;
      const px = x*T - camX, py = y*T + bumpOff;
      switch (ch){
        case '#': {
          ctx.fillStyle = '#c96f2e'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#e8a35c'; ctx.fillRect(px, py, T, 5);
          ctx.fillStyle = '#8a4517'; ctx.fillRect(px, py+T-5, T, 5);
          ctx.fillStyle = 'rgba(0,0,0,.14)';
          ctx.fillRect(px+6, py+14, 5, 5); ctx.fillRect(px+22, py+24, 6, 6); ctx.fillRect(px+14, py+32, 4, 4);
          ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeRect(px+0.5, py+0.5, T-1, T-1);
          break;
        }
        case 'B': {
          ctx.fillStyle = '#b5492a'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#e07a4f'; ctx.fillRect(px, py, T, 3);
          ctx.fillStyle = '#7c2d16';
          ctx.fillRect(px, py+19, T, 2); ctx.fillRect(px, py+T-3, T, 3);
          ctx.fillRect(px+19, py+2, 2, 17);
          ctx.fillRect(px, py+22, 2, T-22); ctx.fillRect(px+24, py+22, 2, T-22);
          ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.strokeRect(px+0.5, py+0.5, T-1, T-1);
          break;
        }
        case '?': {
          const gl = Math.sin(tGlobal*0.15 + x*0.6) * 0.5 + 0.5;
          ctx.fillStyle = '#f8b442'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = `rgba(255,255,255,${0.25*gl})`; ctx.fillRect(px, py, T, 8);
          ctx.fillStyle = '#7c3b12';
          ctx.fillRect(px, py+T-4, T, 4); ctx.fillRect(px+T-4, py, 4, T);
          ctx.strokeStyle = '#7c3b12'; ctx.lineWidth = 2; ctx.strokeRect(px+1, py+1, T-2, T-2);
          for (const [rx,ry] of [[5,5],[31,5],[5,31],[31,31]])
            { ctx.fillStyle = '#7c3b12'; ctx.fillRect(px+rx-2, py+ry-2, 4, 4); }
          ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
          ctx.fillText('?', px + T/2, py + T/2 + 9);
          ctx.textAlign = 'left';
          break;
        }
        case 'U': {
          ctx.fillStyle = '#9c6b3d'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#7a4f28';
          ctx.fillRect(px, py+T-4, T, 4); ctx.fillRect(px+T-4, py, 4, T);
          ctx.fillStyle = '#5d3a1c';
          for (const [rx,ry] of [[5,5],[31,5],[5,31],[31,31]]) ctx.fillRect(px+rx-2, py+ry-2, 4, 4);
          ctx.strokeStyle = '#5d3a1c'; ctx.lineWidth = 2; ctx.strokeRect(px+1, py+1, T-2, T-2);
          break;
        }
        case 'E': {
          ctx.fillStyle = '#7b8aa0'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#a5b4c8'; ctx.fillRect(px, py, T, 4);
          ctx.fillStyle = '#55627a'; ctx.fillRect(px, py+T-4, T, 4); ctx.fillRect(px+T-4, py, 4, T);
          ctx.strokeStyle = '#414d61'; ctx.lineWidth = 2; ctx.strokeRect(px+1, py+1, T-2, T-2);
          break;
        }
        case '!': {
          ctx.fillStyle = '#c3ccd8';
          const n = 4;
          for (let i = 0; i < n; i++){
            const bx = px + i*(T/n), bw = T/n;
            ctx.beginPath();
            ctx.moveTo(bx, py + T);
            ctx.lineTo(bx + bw/2, py + 10);
            ctx.lineTo(bx + bw, py + T);
            ctx.closePath(); ctx.fill();
          }
          ctx.fillStyle = '#7d8896';
          for (let i = 0; i < n; i++){
            const bx = px + i*(T/n), bw = T/n;
            ctx.beginPath();
            ctx.moveTo(bx + bw/2, py + 10);
            ctx.lineTo(bx + bw, py + T);
            ctx.lineTo(bx + bw/2, py + T);
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'C': {
          const cx = px + T/2, cyy = py + T/2;
          const sp = Math.abs(Math.cos(tGlobal * 0.09 + x * 0.7 + y));
          ctx.save();
          ctx.translate(cx, cyy);
          ctx.fillStyle = '#e8a020';
          ctx.beginPath(); ctx.ellipse(0, 0, 13*Math.max(0.25,sp) + 2, 15, 0, 0, 6.29); ctx.fill();
          ctx.fillStyle = '#ffd44d';
          ctx.beginPath(); ctx.ellipse(0, -1, 9*Math.max(0.25,sp) + 1, 11, 0, 0, 6.29); ctx.fill();
          ctx.fillStyle = '#fff3c0';
          ctx.fillRect(-1.5*Math.max(0.25,sp)*8 - 1, -6, 3*Math.max(0.25,sp)+1, 9);
          ctx.restore();
          break;
        }
      }
    }
  }
}

function drawPipes(){
  for (const pp of LV.pipes){
    const topY = (12 - pp.h + 1) * T;
    const px = pp.x * T - camX - 4, pw = T*2 + 8;
    const ph2 = 13*T - topY - 16;
    let g = ctx.createLinearGradient(px + 6, 0, px + pw - 6, 0);
    g.addColorStop(0, GREEND); g.addColorStop(0.18, GREEN); g.addColorStop(0.45, GREENL);
    g.addColorStop(0.8, GREEN); g.addColorStop(1, GREEND);
    ctx.fillStyle = g;
    ctx.fillRect(px + 6, topY + 16, pw - 12, ph2);
    ctx.fillStyle = GREEN;
    ctx.fillRect(px, topY, pw, 18);
    ctx.strokeStyle = GREEND; ctx.lineWidth = 3;
    ctx.strokeRect(px + 1.5, topY + 1.5, pw - 3, 15);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(px + 6, topY + 3, 6, 12);
  }
}

function drawCastle(){
  const x = LV.CASTLE_X - camX;
  if (x > VPW + 120) return;
  const gy = 13 * T;
  ctx.fillStyle = '#c96f2e';
  ctx.fillRect(x, gy - 4*40, 8*40, 4*40);
  ctx.fillStyle = '#e8a35c';
  ctx.fillRect(x, gy - 4*40, 8*40, 6);
  ctx.fillStyle = '#a3551e';
  for (let i = 0; i < 8; i++) ctx.fillRect(x + i*40, gy - 4*40 - 12, 24, 12);
  // tower
  ctx.fillStyle = '#c96f2e';
  ctx.fillRect(x + 40, gy - 7*40, 4*40, 3*40);
  ctx.fillStyle = '#e8a35c'; ctx.fillRect(x + 40, gy - 7*40, 4*40, 6);
  ctx.fillStyle = '#a3551e';
  for (let i = 0; i < 4; i++) ctx.fillRect(x + 40 + i*40, gy - 7*40 - 12, 24, 12);
  // windows
  ctx.fillStyle = '#3a2410';
  ctx.fillRect(x + 20, gy - 7*40 + 26, 16, 22);
  ctx.fillRect(x + 120, gy - 7*40 + 26, 16, 22);
  ctx.fillRect(x + 80, gy - 7*40 + 26, 16, 22);
  ctx.fillRect(x + 16, gy - 2*40 + 10, 18, 24);
  ctx.fillRect(x + 6*40 - 4, gy - 2*40 + 10, 18, 24);
  // gate
  ctx.fillStyle = '#241408';
  const gx = x + 3*40 + 6;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy - 52);
  ctx.arc(gx + 14, gy - 52, 14, Math.PI, 0);
  ctx.lineTo(gx + 28, gy);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeRect(x+0.5, gy-4*40+0.5, 8*40-1, 4*40-1);
}

function drawFlag(){
  const px = LV.FLAG_X * T + 19 - camX;
  if (px < -40 || px > VPW + 40) return;
  const top = 3*T - 10, bot = 13*T;
  ctx.fillStyle = '#d8e6f2';
  ctx.fillRect(px, top, 5, bot - top);
  ctx.fillStyle = '#9fb4c6';
  ctx.fillRect(px + 3, top, 2, bot - top);
  ctx.fillStyle = '#3aa655';
  ctx.beginPath(); ctx.arc(px + 2.5, top - 6, 8, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#7b8aa0'; ctx.fillRect(px - 17, 13*T - T + 16, 40, T - 16);
  const fy = 3*T + 14 + flagDrop * (10*T - 20);
  ctx.fillStyle = '#3aa655';
  ctx.beginPath();
  ctx.moveTo(px, fy);
  ctx.lineTo(px - 34, fy + 14);
  ctx.lineTo(px, fy + 28);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px - 13, fy + 14, 5, 0, 6.29); ctx.fill();
}

/* ---- player sprite (procedural chibi) ---- */
function drawPlayer(px, py, facing, o){
  o = o || {};
  const run = !o.dead && o.onGround && Math.abs(o.vx || 0) > 0.5;
  const air = !o.dead && !o.onGround;
  const ph = o.animT || 0;
  const legPh = run ? Math.sin(ph * 0.62) : 0;
  ctx.save();
  ctx.translate(px + 13, py + 44);
  ctx.scale(facing, 1);

  const legH = 10;
  ctx.fillStyle = NAVY;
  if (air){
    ctx.fillRect(-11, -legH - 3, 8, legH + 3);
    ctx.fillRect(2, -legH - 1, 8, legH + 1);
  } else {
    const lo = run ? legPh * 5 : 0;
    ctx.fillRect(-10 + lo*0.4, -legH, 8, legH);
    ctx.fillRect(3 - lo*0.4, -legH, 8, legH);
  }
  ctx.fillStyle = SHOE;
  if (air){
    ctx.fillRect(-13, -6, 12, 6);
    ctx.fillRect(1, -4, 13, 4);
  } else {
    const lo = run ? legPh * 5 : 0;
    ctx.fillRect(-13 + lo*0.4, -5, 12, 5);
    ctx.fillRect(1 - lo*0.4, -5, 13, 5);
  }
  ctx.fillStyle = NAVY; ctx.fillRect(-10, -30, 20, 21);
  ctx.fillStyle = NAVYD; ctx.fillRect(6, -30, 4, 21);
  ctx.fillStyle = TEAL; ctx.fillRect(-10, -33, 20, 9);
  const armSw = run ? -legPh * 4 : (air ? -5 : 2);
  ctx.fillStyle = TEAL;
  ctx.fillRect(-13, -31 + armSw*0.5, 5, 13);
  ctx.fillRect(8, -31 - armSw*0.5, 5, 13);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-13, -19 + armSw*0.5, 5, 4);
  ctx.fillRect(8, -19 - armSw*0.5, 5, 4);
  ctx.fillStyle = '#ffd44d';
  ctx.fillRect(-5, -24, 4, 4); ctx.fillRect(2, -24, 4, 4);
  ctx.fillStyle = SKIN; ctx.fillRect(-9, -45, 18, 13);
  ctx.fillStyle = HAIR; ctx.fillRect(-11, -44, 4, 9);
  ctx.fillStyle = TEAL; ctx.fillRect(-10, -47, 18, 6);
  ctx.fillStyle = TEALD; ctx.fillRect(4, -43, 11, 4);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-8, -47, 6, 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(3, -42, 4, 5);
  ctx.fillStyle = '#222'; ctx.fillRect(5, -41, 2, 4);
  ctx.fillStyle = HAIR; ctx.fillRect(0, -34, 8, 3);
  ctx.fillStyle = SKIND; ctx.fillRect(9, -38, 3, 4);

  if (o.dead){
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(2, -43); ctx.lineTo(6, -39);
    ctx.moveTo(6, -43); ctx.lineTo(2, -39);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e){
  const x = e.x - camX, y = e.y;
  if (x < -60 || x > VPW + 60) return;
  const cx = x + e.w/2, bot = y + e.h;
  if (e.state === 'squash'){
    ctx.fillStyle = e.type === 'zzt' ? '#6e63a8' : '#9c4a21';
    ctx.beginPath(); ctx.ellipse(cx, bot - 6, e.w/2 + 2, 7, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = e.type === 'zzt' ? '#4a4170' : '#5e2c11';
    ctx.fillRect(x + 1, bot - 8, 8, 8); ctx.fillRect(x + e.w - 9, bot - 8, 8, 8);
    return;
  }
  const bob = Math.sin(e.t * 2) * 1.5;
  if (e.type === 'goomba'){
    const fw = Math.sin(e.t * 6) * 4;
    ctx.fillStyle = '#5e2c11';
    ctx.beginPath(); ctx.ellipse(cx - 8 + fw, bot - 3, 8, 5, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 8 - fw, bot - 3, 8, 5, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#9c4a21';
    ctx.beginPath();
    ctx.moveTo(x, bot - 4);
    ctx.quadraticCurveTo(x, y + bob, cx, y + bob);
    ctx.quadraticCurveTo(x + e.w, y + bob, x + e.w, bot - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7c3616';
    ctx.beginPath();
    ctx.moveTo(x, bot - 4);
    ctx.quadraticCurveTo(x + 4, bot - 12, x + e.w/2, bot - 10);
    ctx.quadraticCurveTo(x + e.w - 4, bot - 12, x + e.w, bot - 4);
    ctx.closePath(); ctx.fill();
    const look = e.direction === 1 ? 1 : 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx - 7, y + 12 + bob, 5, 6, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 7, y + 12 + bob, 5, 6, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(cx - 6 + look*2, y + 13 + bob, 2.4, 3.4, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 6 + look*2, y + 13 + bob, 2.4, 3.4, 0, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - 12, y + 6 + bob); ctx.lineTo(cx - 3, y + 9 + bob);
    ctx.moveTo(cx + 12, y + 6 + bob); ctx.lineTo(cx + 3, y + 9 + bob);
    ctx.stroke();
  } else {
    // zz-t (fast walker)
    const fw = Math.sin(e.t * 9) * 5;
    ctx.fillStyle = '#4a4170';
    ctx.beginPath(); ctx.ellipse(cx - 7 + fw, bot - 3, 8, 5, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 7 - fw, bot - 3, 8, 5, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#6e63a8';
    ctx.beginPath();
    ctx.moveTo(x, bot - 4);
    ctx.quadraticCurveTo(x - 2, y + bob, cx, y + bob);
    ctx.quadraticCurveTo(x + e.w + 2, y + bob, x + e.w, bot - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8f84c4';
    for (let i = 0; i < 5; i++){
      const sx = x + 3 + i * (e.w - 6)/4;
      ctx.beginPath();
      ctx.moveTo(sx - 4, y + 9 + bob);
      ctx.lineTo(sx, y + 2 + bob);
      ctx.lineTo(sx + 4, y + 9 + bob);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx - 7, y + 13 + bob, 5, 6, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 7, y + 13 + bob, 5, 6, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffd44d';
    ctx.beginPath(); ctx.ellipse(cx - 7, y + 14 + bob, 2.6, 3.6, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 7, y + 14 + bob, 2.6, 3.6, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#3a3158';
    ctx.fillRect(cx - 8, y + 21 + bob, 16, 4);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(cx - 7 + i*6, y + 21 + bob);
      ctx.lineTo(cx - 5 + i*6, y + 26 + bob);
      ctx.lineTo(cx - 3 + i*6, y + 21 + bob);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawParticles(cam){
  for (const q of parts){
    const a = 1 - q.t / q.life;
    const x = q.x - cam, y = q.y;
    if (x < -30 || x > VPW + 30) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    if (q.type === 'shard'){
      ctx.translate(x, y); ctx.rotate(q.rot);
      ctx.fillStyle = q.color; ctx.fillRect(-q.size/2, -q.size/2, q.size, q.size);
    } else if (q.type === 'dust'){
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(x, y, q.size * (0.6 + q.t/q.life * 0.8), 0, 6.29); ctx.fill();
    } else if (q.type === 'spark'){
      ctx.fillStyle = q.color;
      ctx.translate(x, y);
      const s = q.size * a;
      ctx.fillRect(-s, -1, s*2, 2); ctx.fillRect(-1, -s, 2, s*2);
    } else if (q.type === 'text'){
      ctx.font = 'bold 17px monospace';
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(q.txt, x + 1, y + 1);
      ctx.fillStyle = q.color; ctx.fillText(q.txt, x, y);
    } else if (q.type === 'coinh'){
      const sp = Math.abs(Math.cos(q.t * 0.4));
      ctx.fillStyle = '#e8a020';
      ctx.beginPath(); ctx.ellipse(x, y, 11*Math.max(0.3,sp), 13, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#ffd44d';
      ctx.beginPath(); ctx.ellipse(x, y - 1, 7*Math.max(0.3,sp), 9, 0, 0, 6.29); ctx.fill();
    } else if (q.type === 'fw'){
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(x, y, q.size, 0, 6.29); ctx.fill();
    } else {
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(x, y, q.size, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBG(cam){
  const g = ctx.createLinearGradient(0, 0, 0, VPH);
  g.addColorStop(0, '#5c94fc'); g.addColorStop(0.55, '#8ec5ff'); g.addColorStop(1, '#c8e4ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VPW, VPH);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  for (const c of clouds){
    const x = ((c.x - cam * 0.3 + tGlobal * 0.06) % (VPW + 900) + (VPW + 900)) % (VPW + 900) - 300;
    ctx.beginPath();
    ctx.arc(x, c.y, 18*c.s, 0, 6.29);
    ctx.arc(x + 22*c.s, c.y - 8*c.s, 15*c.s, 0, 6.29);
    ctx.arc(x + 44*c.s, c.y, 17*c.s, 0, 6.29);
    ctx.arc(x + 22*c.s, c.y + 6*c.s, 16*c.s, 0, 6.29);
    ctx.fill();
  }
  for (const h of hills){
    const x = h.x - cam * 0.5;
    if (x < -h.w || x > VPW + h.w) continue;
    const gy = 13 * T + 2;
    ctx.fillStyle = h.tone ? '#3f9e5e' : '#2f8a4e';
    ctx.beginPath();
    ctx.moveTo(x - h.w/2, gy);
    ctx.quadraticCurveTo(x - h.w/4, gy - h.h * 1.1, x, gy - h.h);
    ctx.quadraticCurveTo(x + h.w/4, gy - h.h * 1.1, x + h.w/2, gy);
    ctx.closePath(); ctx.fill();
  }
  for (const b of bushes){
    const x = b.x - cam * 0.8;
    if (x < -80 || x > VPW + 80) continue;
    const gy = 13 * T + 4;
    ctx.fillStyle = '#4cbf6d';
    for (let i = 0; i < b.n; i++){
      ctx.beginPath();
      ctx.arc(x + i * 20 * b.s, gy - 6*b.s, 15 * b.s, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < b.n; i++){
      ctx.beginPath();
      ctx.arc(x + i * 20 * b.s - 4, gy - 10*b.s, 5 * b.s, 0, 6.29);
      ctx.fill();
    }
  }
}

function text(str, x, y, size, color, align, shadow){
  ctx.font = 'bold ' + size + 'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = align || 'left';
  if (shadow !== false){ ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color || '#fff';
  ctx.fillText(str, x, y);
  ctx.textAlign = 'left';
}

function drawHUD(){
  ctx.save();
  text('QWEN 3.8', 24, 30, 15, '#dff3ff');
  text('SCORE ' + String(score).padStart(6,'0'), 24, 52, 15, '#fff');
  text('WORLD 1-1', VPW/2 - 40, 30, 15, '#fff');
  text('TIME ' + String(Math.max(0, Math.ceil(timeLeft))).padStart(3,'0'), VPW/2 - 60, 52, 15, timeLeft < 60 ? '#ff6b5d' : '#fff');
  text('COINS ×' + String(coins).padStart(2,'0'), VPW - 150, 30, 15, '#ffd44d');
  ctx.save(); ctx.translate(VPW - 150, 40); ctx.scale(0.55, 0.55);
  drawPlayer(0, 0, 1, { onGround: true, vx: 0, animT: 0 });
  ctx.restore();
  text('×' + lives, VPW - 112, 70, 15, '#fff');
  if (A.muted) text('MUTED', VPW - 150, 90, 12, '#9fe8ff');
  if (bannerT > 0){
    ctx.globalAlpha = Math.min(1, bannerT / 20);
    text(bannerTxt, VPW - 24, 120, 18, '#9fe8ff', 'right');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function bigPanel(title, lines, prompt, accent){
  ctx.fillStyle = 'rgba(10,14,30,.72)';
  ctx.fillRect(0, 0, VPW, VPH);
  const cy = VPH/2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,200,180,.5)'; ctx.shadowBlur = 24;
  text(title, VPW/2, cy - 70, 54, accent || '#fff', 'center');
  ctx.restore();
  lines.forEach((L, i) => text(L, VPW/2, cy - 14 + i*30, 19, L.startsWith('BEST') || L.startsWith('COINS') || L.startsWith('SCORE') ? '#ffd44d' : '#cfe0ff', 'center'));
  if (prompt && Math.floor(tGlobal / 30) % 2 === 0)
    text(prompt, VPW/2, cy + 120, 20, '#9fe8ff', 'center');
}

/* parallax props */
const clouds = [], hills = [], bushes = [];
(function(){
  for (let i = 0; i < 26; i++) clouds.push({ x: Math.random()*3600, y: 30 + Math.random()*150, s: 0.7 + Math.random()*0.9 });
  for (let x = 0; x < 5200; x += 170 + Math.random()*120)
    hills.push({ x, w: 150 + Math.random()*130, h: 70 + Math.random()*80, tone: Math.random() > 0.5 });
  for (let x = 0; x < 7600; x += 130 + Math.random()*160)
    bushes.push({ x, n: 2 + (Math.random()*2|0), s: 0.8 + Math.random()*0.6 });
})();

function render(){
  tGlobal++;
  ctx.clearRect(0, 0, VPW, VPH);
  const cam = Math.round(camX + (shake > 0.3 ? (Math.random()-0.5)*shake*2 : 0));
  const camY = Math.min(0, VPH - LH*T);   // pin to bottom of world

  drawBG(cam);
  ctx.save();
  ctx.translate(0, camY);
  drawTiles();
  drawPipes();
  drawCastle();
  drawFlag();
  drawParticles(cam);
  for (const e of enemies) if (!e.dead && e.active && state !== 'menu') drawEnemy(e);
  if (state === 'menu'){
    drawPlayer(p.x - cam, p.y, 1, { onGround: p.vy === 0, vx: 0, animT: p.animT + tGlobal*0.05 });
  } else if (state !== 'gameover'){
    if (state === 'dying'){
      drawPlayer(p.x - cam, p.y, p.facing, { dead: true, onGround: false, animT: 0 });
    } else if (state === 'flag' || state === 'clear' || state === 'win'){
      drawPlayer(p.x - cam, p.y, 1, { onGround: true, vx: state==='flag' && flagPhase===2 ? 2 : 0, animT: p.animT });
    } else {
      drawPlayer(p.x - cam, p.y, p.facing, { onGround: p.onGround, vx: p.vx, animT: p.animT });
    }
  }
  ctx.restore();

  if (state !== 'menu') drawHUD();

  if (state === 'menu'){
    ctx.fillStyle = 'rgba(8,12,28,.55)'; ctx.fillRect(0, 0, VPW, VPH);
    const bounce = Math.sin(tGlobal * 0.05) * 8;
    ctx.save();
    ctx.shadowColor = 'rgba(16,220,200,.65)'; ctx.shadowBlur = 30;
    ctx.font = 'bold 74px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    const t1 = 'QWEN 3.8', t2 = 'M A R I O';
    ctx.strokeStyle = '#082430'; ctx.lineWidth = 12; ctx.lineJoin = 'round';
    ctx.strokeText(t1, VPW/2, 150 + bounce);
    const gg = ctx.createLinearGradient(0, 100, 0, 180);
    gg.addColorStop(0, '#8effe4'); gg.addColorStop(0.5, '#12dcc9'); gg.addColorStop(1, '#0a9aa8');
    ctx.fillStyle = gg; ctx.fillText(t1, VPW/2, 150 + bounce);
    ctx.strokeStyle = '#20104a'; ctx.lineWidth = 12;
    ctx.strokeText(t2, VPW/2, 228 + bounce);
    ctx.fillStyle = '#ffd44d'; ctx.fillText(t2, VPW/2, 228 + bounce);
    ctx.restore();
    text('a super-platformer simulation', VPW/2, 268 + bounce, 16, '#b9d1ff', 'center');
    if (Math.floor(tGlobal / 32) % 2 === 0)
      text('PRESS  ENTER  TO  START', VPW/2, 340, 26, '#eafcff', 'center');
    text('← → / A D  move      SPACE / ↑  jump', VPW/2, 408, 15, '#9fb6dd', 'center');
    text('stomp enemies · hit ? blocks · grab coins · reach the flag', VPW/2, 432, 14, '#8ba3cb', 'center');
    text('P pause   ·   M mute   ·   R restart', VPW/2, 456, 15, '#9fb6dd', 'center');
    text('BEST  ' + String(best).padStart(6,'0'), VPW/2, 496, 16, '#ffd44d', 'center');
    text('v3.8 · built with 100% neural love', VPW/2, 522, 12, 'rgba(160,190,230,.5)', 'center');
  }
  else if (state === 'intro'){
    ctx.fillStyle = 'rgba(4,6,14,.85)'; ctx.fillRect(0, 0, VPW, VPH);
    const a = Math.min(1, stateT / 20) * (stateT > 110 ? Math.max(0, (132 - stateT) / 22) : 1);
    ctx.globalAlpha = a;
    text('WORLD 1-1', VPW/2, VPH/2 + 10, 52, '#fff', 'center');
    ctx.save(); ctx.translate(VPW/2 - 220, VPH/2 - 46); ctx.scale(1.1, 1.1);
    drawPlayer(0, 0, 1, { onGround: true, vx: 0, animT: 0 });
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  else if (state === 'pause'){
    bigPanel('PAUSED', ['PICK IT UP WHERE YOU LEFT IT'], 'P — resume', '#9fe8ff');
  }
  else if (state === 'gameover'){
    bigPanel('GAME OVER', ['SCORE  ' + String(score).padStart(6,'0'),
                           'BEST   ' + String(best).padStart(6,'0')],
             'ENTER — MENU', '#ff6b5d');
  }
  else if (state === 'clear'){
    ctx.fillStyle = 'rgba(6,10,24,.45)'; ctx.fillRect(0, 0, VPW, VPH);
    ctx.save();
    ctx.shadowColor = 'rgba(120,255,120,.6)'; ctx.shadowBlur = 20;
    text('COURSE CLEAR!', VPW/2, VPH/2 - 10, 48, '#b8ffb0', 'center');
    ctx.restore();
    text('WORLD 1-1 COMPLETE', VPW/2, VPH/2 + 34, 18, '#dff3ff', 'center');
  }
  else if (state === 'win'){
    bigPanel('COURSE CLEAR!',
      [ 'WORLD 1-1 COMPLETE',
        'SCORE   ' + String(score).padStart(6,'0'),
        'COINS   ×' + String(coins).padStart(2,'0'),
        'TIME    ' + String(Math.ceil(timeLeft)).padStart(3,'0'),
        'BEST    ' + String(best).padStart(6,'0') ],
      'ENTER — PLAY AGAIN', '#b8ffb0');
  }
}

/* ============================ MAIN LOOP ============================ */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now){
  requestAnimationFrame(frame);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  while (acc >= STEP){ update(); acc -= STEP; }
  render();
}
resetLevel();
requestAnimationFrame(frame);
</script>
</body>
